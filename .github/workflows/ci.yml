name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 這個 repo 曾經因為 .gitignore 的 `lib/` 規則把 frontend/src/lib/ 整個目錄
  # 排除在版控外，導致前端在 fresh clone 時完全無法建置。用一個便宜的檢查
  # 確保原始碼目錄不會再被 ignore 規則吃掉。
  guard-ignored-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if source files under frontend/src or backend/app are git-ignored
        run: |
          set -e
          ignored=$(git ls-files --others --ignored --exclude-standard frontend/src backend/app || true)
          if [ -n "$ignored" ]; then
            echo "::error::以下原始碼檔案被 .gitignore 排除，將不會進版控："
            echo "$ignored"
            exit 1
          fi
          echo "OK：沒有被忽略的原始碼檔案"

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff@latest check app tests
      - name: Ruff format check
        run: uvx ruff@latest format --check app tests

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev || uv pip install --system -e ".[dev]"
      - name: Pytest
        run: uv run pytest tests/unit -q
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          ENVIRONMENT: development

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bandit
        run: uvx bandit -q -r app -ll
